# docker-compose.yml

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fastapi_backend
    image: ats-backend:latest
    ports:
      - "8000:8000"
    environment:
      - ACCEPT_EULA=Y
    depends_on:
      - client

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: angular_client
    image: ats-client:latest
    ports:
      - "4200:4200"
